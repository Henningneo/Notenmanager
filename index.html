<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notenmanager Oberstufe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141c2b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notenmanager">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Kopfleiste mit Rauten-Marke + Tabs, darunter eine Spalte (max 1180px); Übersicht = Kennzahlen → Halbjahre → Einbringungsmatrix → Zulassung */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-2: #eaf0f8;
  --fg: #13203a;
  --muted: #5a6782;
  --line: #d6deeb;
  --accent: #1a5cb0;
  --accent-fg: #ffffff;
  --accent-soft: #e1ecfb;
  --good: #19804a;
  --good-soft: #def3e6;
  --warn: #a86a0c;
  --warn-soft: #fbefd9;
  --bad: #bd3a24;
  --bad-soft: #fbe3de;
  --shadow: 0 1px 2px rgba(19, 32, 58, .06), 0 4px 16px rgba(19, 32, 58, .05);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1320; --surface: #141c2b; --surface-2: #1b2538; --fg: #e5ebf5; --muted: #98a5bb;
    --line: #29344b; --accent: #6aa5ff; --accent-fg: #0b1424; --accent-soft: #1a2b48;
    --good: #4cc387; --good-soft: #15301f; --warn: #e3b458; --warn-soft: #36290f;
    --bad: #f27c66; --bad-soft: #3a1c16; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1320; --surface: #141c2b; --surface-2: #1b2538; --fg: #e5ebf5; --muted: #98a5bb;
  --line: #29344b; --accent: #6aa5ff; --accent-fg: #0b1424; --accent-soft: #1a2b48;
  --good: #4cc387; --good-soft: #15301f; --warn: #e3b458; --warn-soft: #36290f;
  --bad: #f27c66; --bad-soft: #3a1c16; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--muted); }

/* Kopf */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 12px 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.raute { width: 30px; height: 30px; border-radius: 7px; flex: none;
  background: conic-gradient(from 45deg, var(--accent) 0 25%, var(--surface) 0 50%, var(--accent) 0 75%, var(--surface) 0) 0 0 / 10px 10px;
  border: 1px solid var(--accent); }
.brand h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; }
.brand .sub { font-size: .78rem; color: var(--muted); }
.sync { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--surface-2); }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="synced"] .dot { background: var(--good); }
.sync[data-s="saving"] .dot, .sync[data-s="connecting"] .dot { background: var(--warn); }
.sync[data-s="error"] .dot, .sync[data-s="offline"] .dot { background: var(--bad); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 9px 14px 10px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .92rem; border-bottom: 2.5px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }

main { padding-block: 22px 60px; display: grid; gap: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.grid { display: grid; gap: 16px; }
.g-hero { grid-template-columns: minmax(0, 1.25fr) minmax(0, 2fr); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .g-hero { grid-template-columns: 1fr; } .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .g-2 { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .g-4 { grid-template-columns: 1fr; } }

/* Abischnitt */
.hero { display: flex; flex-direction: column; gap: 10px; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.hero .label { color: inherit; opacity: .8; }
.schnitt { font-family: var(--font-display); font-weight: 800; font-size: clamp(3.4rem, 9vw, 4.8rem); line-height: 1; letter-spacing: -.03em; }
.hero .meta { font-size: .9rem; opacity: .9; }
.bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, currentColor 22%, transparent); overflow: hidden; }
.bar > i { display: block; height: 100%; background: currentColor; border-radius: inherit; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1.1; }
.stat .v small { font-size: .9rem; font-weight: 600; color: var(--muted); }
@media (max-width: 420px) { .stats { grid-template-columns: 1fr; } }

/* Halbjahr-Karten */
.hj { display: grid; gap: 8px; }
.hj.current { outline: 2px solid var(--accent); outline-offset: -1px; }
.hj .big { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1; }
.hj-row { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }

/* Punkte-Chips */
.pt { display: inline-flex; align-items: center; justify-content: center; min-width: 2.1em; height: 1.9em; padding: 0 .45em; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: .9rem; background: var(--surface-2); color: var(--fg); border: 1.5px solid transparent; }
.pt.b5 { background: var(--good-soft); color: var(--good); }
.pt.b4 { background: var(--accent-soft); color: var(--accent); }
.pt.b2 { background: var(--warn-soft); color: var(--warn); }
.pt.b1 { background: var(--bad-soft); color: var(--bad); }
.pt.out { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); font-weight: 600; }
.pt.plan { border-style: dashed; border-color: currentColor; }
.pt.raw { font-weight: 600; }

/* Tabelle */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; min-width: 520px; }
th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
td.c, th.c { text-align: center; }
td.r, th.r { text-align: right; }
tfoot td { font-weight: 700; border-bottom: none; }
.subj-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; color: var(--muted); margin-top: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Badges */
.badge { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.lf { background: var(--accent); color: var(--accent-fg); }
.badge.abi { background: var(--accent-soft); color: var(--accent); }
#profile { text-transform: none; letter-spacing: 0; font-size: .82rem; padding: 4px 10px; border-radius: 999px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

/* Checks */
.checks { display: grid; gap: 8px; list-style: none; padding: 0; margin: 0; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.checks li:last-child { border-bottom: none; }
.ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 800; margin-top: 1px; }
.ico.ok { background: var(--good-soft); color: var(--good); }
.ico.warn { background: var(--bad-soft); color: var(--bad); }
.ico.open { background: var(--surface-2); color: var(--muted); }

/* Formulare & Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; padding: 6px 8px; }
.btn.sm { padding: 5px 10px; font-size: .82rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }
.field input:disabled, .field select:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.card.editing { outline: 2px solid var(--accent); outline-offset: -1px; }
.fc-start { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.fc-bar { position: sticky; top: 8px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); border: 1px dashed var(--warn); }
.fc-bar > div { display: flex; flex-direction: column; gap: 2px; }
body.forecast #app { outline: 2px dashed var(--warn); outline-offset: 6px; border-radius: 12px; }
.edit-note { font-size: .82rem; color: var(--accent); font-weight: 600; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 18px; margin: 0; }
.kv div { min-width: 0; }
.kv dt { font-size: .75rem; font-weight: 600; color: var(--muted); }
.kv dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .78rem; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
textarea { min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-size: .8rem; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.form-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Fächer */
.subj-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .subj-layout { grid-template-columns: 1fr; } }
.subj-list { display: grid; gap: 6px; padding: 10px; }
.subj-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 9px 10px; border-radius: 8px; border: 1px solid transparent; background: none; text-align: left; cursor: pointer; width: 100%; }
.subj-item:hover { background: var(--surface-2); }
.subj-item[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.subj-item .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { display: flex; gap: 3px; }
.mini .pt { min-width: 1.75em; height: 1.6em; font-size: .75rem; }
.hjblock { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.hjblock-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.formula { font-size: .83rem; color: var(--muted); }
.grades { display: grid; gap: 6px; }
.grade { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
.grade .t { min-width: 0; }
.grade .t b { font-weight: 600; font-size: .9rem; }
.grade .t div { font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
.need { font-size: .82rem; background: var(--accent-soft); color: var(--fg); padding: 8px 10px; border-radius: 8px; }
details.settings > summary { cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--accent); list-style: none; }
details.settings > summary::-webkit-details-marker { display: none; }
details.settings[open] > summary { margin-bottom: 12px; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.tpl-grid label { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; }
.tpl-grid label.has { opacity: .5; }
.empty { text-align: center; padding: 40px 20px; display: grid; gap: 12px; justify-items: center; }
.empty p { max-width: 52ch; margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); }
.prose { max-width: 70ch; }
.prose p, .prose li { margin: 0 0 8px; }
.prose ul { padding-left: 20px; margin: 0 0 10px; }
.prose a { color: var(--accent); }
.ptable { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.ptable div { text-align: center; padding: 6px 0; border-radius: 6px; background: var(--surface-2); font-size: .82rem; }
.ptable b { display: block; font-size: 1rem; }
@media (max-width: 520px) { .ptable { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <div class="raute" aria-hidden="true"></div>
        <div>
          <h1>Notenmanager Oberstufe</h1>
          <div class="sub">Bayern · Qualifikationsphase · 0–15 Punkte</div>
        </div>
      </div>
      <div class="sync" id="sync" data-s="local" hidden><span class="dot"></span><span id="sync-text">Lokal gespeichert</span></div>
      <span class="badge abi" id="profile" hidden></span>
      <button class="btn sm" id="logout" data-action="logout" hidden>Abmelden</button>
    </div>
    <nav class="tabs" aria-label="Bereiche">
      <a href="#uebersicht" data-tab="uebersicht">Übersicht</a>
      <a href="#faecher" data-tab="faecher">Fächer &amp; Noten</a>
      <a href="#abitur" data-tab="abitur">Abitur</a>
      <a href="#optionen" data-tab="optionen">Optionen</a>
      <a href="#admin" data-tab="admin" id="tab-admin" hidden>Admin</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ================= Konstanten ================= */
const CATS = {
  sa:        { label: "Klausur/Schulaufgabe", group: "gross" },
  abfrage:   { label: "Abfrage", group: "klein" },
  muendlich: { label: "Unterrichtsbeitrag", group: "klein" },
  ex:        { label: "Ex", group: "klein" },
  test:      { label: "Test", group: "klein" },
  praktisch: { label: "Praxis / Projekt", group: "praktisch" },
  // ältere Arten: nicht mehr auswählbar, bereits eingetragene Noten zählen weiter
  klausur:   { label: "Klausur/Schulaufgabe", group: "gross", old: true },
  kurzarbeit:{ label: "Kurzarbeit", group: "klein", old: true },
  referat:   { label: "Referat", group: "klein", old: true },
  sonstige:  { label: "Sonstiger kleiner LN", group: "klein", old: true }
};
const NOTE = ["6","5-","5","5+","4-","4","4+","3-","3","3+","2-","2","2+","1-","1","1+"];
const LABELS = { g9: ["12/1","12/2","13/1","13/2"], g8: ["11/1","11/2","12/1","12/2"] };
const SLOTS_TOTAL = 40;       // eingebrachte Halbjahresleistungen inkl. Seminararbeit
const SLOTS_SEMINAR = 2;      // Seminararbeit zählt wie 2 Halbjahresleistungen

// Fachgruppen für die Wahl der Abiturfächer (§ 48 GSO, § 19 Abs. 1 GSO, Anlage 3)
// field: Aufgabenfeld (slk = sprachl.-lit.-künstl., gpr = gesellschaftswiss., mint = math.-naturwiss.-techn.)
const GROUPS = {
  deutsch:  { label: "Deutsch", field: "slk", abi: true, lf: false },
  mathe:    { label: "Mathematik", field: "mint", abi: true, lf: false },
  fs:       { label: "Fortgeführte Fremdsprache", field: "slk", abi: true, lf: true },
  fs_spaet: { label: "Spät beginnende Fremdsprache (nur mündlich)", field: "slk", abi: true, lf: false, oral: true },
  nw:       { label: "Naturwissenschaft (Biologie, Chemie, Physik)", field: "mint", abi: true, lf: true },
  inf:      { label: "Informatik", field: "mint", abi: true, lf: true },
  inf_spaet:{ label: "Spät beginnende Informatik (nur mündlich)", field: "mint", abi: true, lf: false, oral: true },
  gpr:      { label: "Gesellschaftswiss. Fach (Religion/Ethik, Geschichte, PuG, Geographie, WR)", field: "gpr", abi: true, lf: true },
  kumu:     { label: "Kunst oder Musik", field: "slk", abi: true, lf: true },
  sport:    { label: "Sport (nur als Leistungsfach)", field: null, abi: true, lf: true, lfOnly: true },
  seminar:  { label: "W-Seminar", field: null, abi: false, lf: false },
  vk:       { label: "Vertiefungskurs Deutsch/Mathematik (nur 12/1–12/2)", field: null, abi: false, lf: false },
  none:     { label: "Zusatzangebot / Profilfach (kein Abiturfach, höchstens 3 HJL)", field: null, abi: false, lf: false }
};
const FIELDS = { slk: "sprachlich-literarisch-künstlerisch", gpr: "gesellschaftswissenschaftlich", mint: "mathematisch-naturwissenschaftlich-technisch" };

// Fachvorlagen (Pflichtbelegung laut Stundentafel G9); g = Fachgruppe. Pflichteinbringungen werden automatisch berechnet.
const Q12 = [true, true, false, false];
const TEMPLATES = [
  { name: "Deutsch", short: "D", core: true, g: "deutsch" },
  { name: "Mathematik", short: "M", core: true, g: "mathe" },
  { name: "Englisch", short: "E", g: "fs" },
  { name: "Französisch", short: "F", g: "fs" },
  { name: "Latein", short: "L", g: "fs" },
  { name: "Spanisch (spät beginnend)", short: "Sp", g: "fs_spaet" },
  { name: "Spanisch", short: "Sp", g: "fs" },
  { name: "Italienisch", short: "It", g: "fs" },
  { name: "Griechisch", short: "Gr", g: "fs" },
  { name: "Katholische Religionslehre", short: "K", g: "gpr" },
  { name: "Evangelische Religionslehre", short: "Ev", g: "gpr" },
  { name: "Ethik", short: "Eth", g: "gpr" },

function computeAll() {

  let sel = selectFor(slots), streichFach = null, streichArt = null;
  const planned = plannedMandatory();
  const cands = optionCandidates();
  if (planned > SLOTS_TOTAL) {
    // Optionsregel Möglichkeit 2: Streichung nötig, damit die Fächerwahl in 40 Einbringungen passt
    let best = null;
    for (const s of cands) {
      if (plannedMandatory(s.id) > SLOTS_TOTAL) continue;
      const alt = selectFor(slots, s.id);
      if (!best || alt.sum > best.sel.sum) best = { sel: alt, s };
    }
    if (best) { sel = best.sel; streichFach = best.s; streichArt = "Streichung"; }
  } else if (state.settings.streichung) {
    // Optionsregel Möglichkeit 1: Ersatz durch eine bessere Halbjahresleistung
    for (const s of cands) {
      const alt = selectFor(slots, s.id);
      if (alt.n >= sel.n && alt.sum > sel.sum) { sel = alt; streichFach = s; streichArt = "Ersatz"; }
    }
  }
  const plannedFinal = streichFach && streichArt === "Streichung" ? plannedMandatory(streichFach.id) : planned;
  let all = 0;
  for (const s of state.subjects) for (let h = 0; h < 4; h++) if (hjl(s, h)) all++;
  const sem = seminarTotal();
  const knownB1 = sel.sum + (sem ? sem.pts : 0);
  const knownSlots = sel.n + (sem ? SLOTS_SEMINAR : 0);
  const avgB1 = knownSlots ? knownB1 / knownSlots : null;
  const block1 = knownSlots ? (knownSlots >= SLOTS_TOTAL ? knownB1 : avgB1 * SLOTS_TOTAL) : null;

  // Block II: eingetragene Prüfungen ×4, fehlende über Fach-Ø hochrechnen
  let b2 = 0, b2Known = 0, b2Real = 0, examsEntered = 0;
  const examEst = state.exams.map((e, i) => {
    if (e.points != null) { examsEntered++; const v4 = examV4(i); b2Real += v4; return { v4, est: false }; }
    const s = findS(examSubjectId(i));
    let v = null;
    if (s) { const vals = [0, 1, 2, 3].map(h => hjl(s, h)).filter(Boolean).map(r => r.raw); v = avg(vals); }
    if (v == null && avgB1 != null) v = avgB1;
    return { v4: v != null ? v * 4 : null, est: true };
  });
  examEst.forEach(e => { if (e.v4 != null) { b2 += e.v4; b2Known++; } });
  const block2 = b2Known === 5 ? b2 : (b2Known ? b2 / b2Known * 5 : (avgB1 != null ? avgB1 * 20 : null));
  const total = block1 != null && block2 != null ? Math.round(block1) + Math.round(block2) : null;
  return { sel, streichFach, streichArt, planned: plannedFinal, all, sem, knownB1, knownSlots, avgB1, block1, block2, b2Real, examsEntered, examEst, total };
}
function noteFromPoints(P) {
  if (P == null) return null;
  if (P < 300) return null;
  const n = Math.floor((1020 - P) / 18) / 10;
  return Math.max(1, Math.min(4, n));
}
function minPointsFor(note) {
  const t = Math.round(note * 10);
  return Math.max(300, 1020 - 18 * (t + 1) + 1);
}
function fmt(n, d) { if (n == null || isNaN(n)) return "–"; return n.toLocaleString("de-DE", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }

function chip(p, extra, title) {

}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function belegMissing() {

function viewTarget(c) {
  const target = ui.target || 2.0;
  const need = minPointsFor(target);
  const knownB2 = c.b2Real;
  const restSlots = Math.max(0, SLOTS_TOTAL - c.knownSlots);
  const restExams = 5 - c.examsEntered;
  const weight = restSlots + restExams * 4;
  const have = c.knownB1 + knownB2;
  let msg;
  if (weight === 0) msg = have >= need ? "Geschafft – du liegst bei " + have + " Punkten." : "Nicht mehr erreichbar.";
  else {
    const a = (need - have) / weight;
    if (a <= 0) msg = "Schon sicher: Die Punkte reichen bereits.";
    else if (a > 15) msg = "Rechnerisch nicht mehr erreichbar (du bräuchtest " + fmt(a, 1) + " Punkte im Schnitt).";
    else msg = "Du brauchst ab jetzt im Schnitt <b class=\"num\">" + fmt(a, 2) + " Punkte</b> (≈ Note " + NOTE[Math.min(15, Math.ceil(a - 1e-9))] + ") in allen noch offenen Halbjahresleistungen und Prüfungen.";
  }
  const opts = [];
  for (let t = 10; t <= 40; t++) opts.push('<option value="' + t / 10 + '"' + (Math.abs(t / 10 - target) < 1e-9 ? " selected" : "") + ">" + fmt(t / 10, 1) + "</option>");
  return '<div class="card"><div class="card-head"><h2>Zielrechner</h2><span class="muted small">Was brauche ich noch?</span></div>' +
    '<div class="form-row" style="margin-bottom:14px"><label class="field"><span>Wunsch-Abischnitt</span><select id="target" data-action="target">' + opts.join("") + "</select></label>" +
    '<div class="field"><span>Benötigte Gesamtpunkte</span><div class="num" style="padding:8px 0;font-weight:700">' + need + " von 900</div></div></div>" +
    '<p class="need" style="margin:0">' + msg + "</p>" +
    '<p class="muted small" style="margin:12px 0 0">Offen: ' + restSlots + " Halbjahresleistungen und " + restExams + " Prüfungen (diese zählen vierfach).</p></div>";
}

function findS(id) { return state.subjects.find(s => s.id === id); }

/* ---- Bearbeiten/Speichern für feste Einstellungen ---- */
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_SAVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
const CFG_KEYS = ["name", "short", "type", "lf", "group", "pOv", "maxOv", "hj", "vkPartner"];
function snapConfig() {
  return JSON.stringify({
    s: { subst: state.settings.subst, kumuLf: state.settings.kumuLf, labels: state.settings.labels },
    e: state.exams.map(e => ({ subjectId: e.subjectId, art: e.art })),
    sub: state.subjects.map(s => { const o = { id: s.id }; CFG_KEYS.forEach(k => { o[k] = s[k]; }); return o; })
  });
}
function restoreConfig(str) {
  const c = JSON.parse(str);
  Object.assign(state.settings, c.s);
  c.e.forEach((x, i) => Object.assign(state.exams[i], x));
  c.sub.forEach(o => { const s = findS(o.id); if (s) Object.assign(s, o); });
}
// Abiturfächer: Speichern nur, wenn keine Regel der Fächerwahl verletzt ist (Text der ersten verletzten Regel, sonst null)
function saveBlocker(key) {
  if (key !== "abi") return null;
  const bad = abiChecks().find(x => x.st === "warn");
  return bad ? bad.text : null;
}
function editing(key) { return !!(ui.edit && ui.edit.key === key); }
function editBar(key) {
  if (editing(key)) {
    const block = saveBlocker(key);
    return '<div class="actions"><span class="edit-note"' + (block ? ' style="color:var(--bad)"' : "") + ">" + (block ? "Speichern erst möglich, wenn die Regeln erfüllt sind" : "Bearbeitungsmodus") + '</span><button class="btn sm" data-action="edit-cancel">Abbrechen</button><button class="btn primary sm" data-action="edit-save"' + (block ? ' disabled title="' + block.replace(/<[^>]*>/g, "").replace(/"/g, "&quot;") + '"' : "") + ">" + ICON_SAVE + " Speichern</button></div>";
  }
  return '<button class="btn sm" data-action="edit-start" data-key="' + key + '"' + (ui.edit ? ' disabled title="Speichere zuerst die andere Bearbeitung"' : "") + ">" + ICON_EDIT + " Bearbeiten</button>";
}
// Änderung an einer gesperrten Einstellung: nur vormerken, gespeichert wird mit „Speichern“
function stage(el) {
  if (!ui.edit) { commit(); return; }
  if (el && (el.type === "text" || el.type === "number")) return; // kein Neuaufbau beim Verlassen des Feldes
  render();
}
// genau ein weiteres Leistungsfach neben Deutsch und Mathematik
function setLf(id) {
  state.subjects.forEach(x => { if (!x.core) x.lf = x.id === id; });
  state.exams.forEach((e, i) => { if (i >= 3 && e.subjectId === id) e.subjectId = null; });
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600); }
function newSubjectFrom(t) {
  return fixSubject({ id: uid(), name: t.name, short: t.short || "", type: t.type || "standard", core: !!t.core, lf: !!t.core, group: t.g || "none", vkFor: t.vkFor || null, max: t.max ?? null, hj: t.hj ? t.hj.slice() : [true, true, true, true] });
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.tagName === "SELECT") return;
  const a = el.dataset.action, s = el.dataset.id ? findS(el.dataset.id) : null;
  switch (a) {
    case "open-add": ui.showAdd = true; break;
    case "toggle-add": ui.showAdd = !ui.showAdd; render(); return;
    case "select": ui.selected = el.dataset.id; saveUi(); if (currentTab() !== "faecher") { location.hash = "faecher"; return; } render(); return;
    case "add-subjects": {
      e.preventDefault();
      const picked = [...document.querySelectorAll("[data-tpl]:checked")].map(x => newSubjectFrom(TEMPLATES[+x.dataset.tpl]));
      const custom = document.getElementById("custom-name").value.trim();
      if (custom) picked.push(newSubjectFrom({ name: custom, short: custom.slice(0, 3), p: 0, g: document.getElementById("custom-group").value }));
      if (!picked.length) { toast("Wähle mindestens ein Fach aus."); return; }
      state.subjects.push(...picked); ui.showAdd = false; ui.selected = picked[0].id; saveUi();
      commit(); toast(picked.length === 1 ? "Fach angelegt" : picked.length + " Fächer angelegt"); return;
    }
    case "del-grade": s.grades = s.grades.filter(g => g.id !== el.dataset.g); commit(); toast("Note gelöscht"); return;
    case "toggle-plan": { const g = s.grades.find(g => g.id === el.dataset.g); g.plan = !g.plan; commit(); return; }
    case "ask-del": ui.confirm = "del-" + s.id; render(); return;
    case "ask-reset": ui.confirm = "reset"; render(); return;
    case "cancel-confirm": ui.confirm = null; render(); return;
    case "del-subject": ui.edit = null; state.subjects = state.subjects.filter(x => x.id !== s.id); state.exams.forEach(x => { if (x.subjectId === s.id) x.subjectId = null; }); ui.confirm = null; ui.selected = null; commit(); toast("Fach gelöscht"); return;
    case "reset": { const keep = state.settings; state = defaultState(); state.settings = keep; ui.confirm = null; commit(); toast("Alle Daten gelöscht"); return; }
    case "edit-start":
      if (!ui.edit) { const k = el.dataset.key; ui.edit = { key: k, backup: k === "admin" ? JSON.stringify(ui.adminVault) : snapConfig() }; ui.confirm = null; ui.adminNew = null; ui.adminConfirmDel = null; }
      render(); return;
    case "edit-save":
      if (ui.edit && ui.edit.key === "admin") {
        if (ui.adminBusy) return;
        ui.adminBusy = true;
        saveCodeList().then(() => { ui.edit = null; toast("Codeliste gespeichert"); }, err => toast(err.message)).finally(() => { ui.adminBusy = false; render(); });
        return;
      }
      if (ui.edit && saveBlocker(ui.edit.key)) { toast("Nicht gespeichert: " + saveBlocker(ui.edit.key).replace(/<[^>]*>/g, "")); return; }
      ui.edit = null; ui.confirm = null; commit(); toast("Gespeichert"); return;
    case "edit-cancel":
      if (ui.edit && ui.edit.key === "admin") { ui.adminVault = JSON.parse(ui.edit.backup); ui.edit = null; render(); toast("Änderungen verworfen"); return; }
      if (ui.edit) restoreConfig(ui.edit.backup); ui.edit = null; ui.confirm = null; commit(); toast("Änderungen verworfen"); return;
    case "admin-create": {
      if (ui.adminBusy || !ui.adminVault) return;
      const note = (document.getElementById("admin-new-note").value || "").trim();
      const name = (document.getElementById("admin-new-name").value || "").trim();
      ui.adminBusy = true; render();
      createCode(name, note).then(e => toast("Neuer Code für " + (e.name || "Profil " + e.nr) + ": " + fmtCode(e.code)), err => toast(err.message)).finally(() => { ui.adminBusy = false; render(); });
      return;
    }
    case "admin-delete-ask": ui.adminConfirmDel = +el.dataset.nr; ui.adminNew = null; render(); return;
    case "admin-delete-cancel": ui.adminConfirmDel = null; render(); return;
    case "admin-delete": {
      if (ui.adminBusy) return;
      const nr = +el.dataset.nr;
      ui.adminBusy = true; render();
      deleteCode(nr).then(e => { ui.adminConfirmDel = null; if (e) toast((e.name || "Profil " + e.nr) + " wurde gelöscht"); }, err => toast(err.message)).finally(() => { ui.adminBusy = false; render(); });
      return;
    }
    case "copy-code": {
      const txt = el.dataset.code;
      try { navigator.clipboard.writeText(txt).then(() => toast("Code kopiert: " + txt), () => toast("Kopieren nicht möglich – Code: " + txt)); } catch (err) { toast("Code: " + txt); }
      return;
    }
    case "logout": logout(); toast("Abgemeldet"); return;
    case "admin-auth-logout": adminSignOut().then(() => { render(); toast("Admin abgemeldet"); }); return;
    case "import-legacy": {
      if (!legacy) return;
      if (forecast) { toast("Verlasse zuerst den Prognosemodus."); return; }
      state = migrate(JSON.parse(JSON.stringify(legacy)));
      legacy = null; writeLS(LS_LEGACY_DONE, "1");
      commit(); toast("Bisherige Noten übernommen"); return;
    }
    case "grade-open": ui.addGrade = el.dataset.id; render(); return;
    case "grade-close": ui.addGrade = null; render(); return;
    case "forecast-start": startForecast(); return;
    case "forecast-end": endForecast(); return;
    case "export": doExport(); return;
    case "copy": doCopy(); return;
    case "import": doImport(); return;

async function login(code, remember) {

  const listSrc = await fetchCodeList(true);

const LS_CODES = "notenmanager-codes-v1";

async function fetchCodeList(allowCache) {

async function fetchCodeListServer() {

  if (!d) return false;
  try {
    const snap = await withTimeout(d.doc(CODES_DOC).get(), 8000);
    if (!snap) return false;
    codeListMissing = !snap.exists;
    const x = snap.exists ? snap.data() : (MIGRATION_CODES || {});
    codeList = {
      extra: Array.isArray(x.extra) ? x.extra.map(e => ({ h: e.h, nr: e.nr })) : [],
      blocked: Array.isArray(x.blocked) ? x.blocked.slice() : [],
      deleted: Array.isArray(x.deleted) ? x.deleted.slice() : [],
      names: x.names && typeof x.names === "object" ? JSON.parse(JSON.stringify(x.names)) : {},

async function loadAdminVault() {

  let entries = null;
  try {
    if (codeList.vault) entries = await decryptObj(my.key, codeList.vault);
    else {
      const s = await decryptObj(my.key, SEED_VAULT);
      entries = [];
      for (let i = 0; i < 20; i++) entries.push({ nr: i + 1, code: s.slice(i * 12, i * 12 + 12), name: "", note: i === 0 ? "Admin" : "", created: null, blocked: false });
    }
    for (const e of entries) { e.h = await sha256hex("nm-code:" + e.code); e.blocked = codeList.blocked.includes(e.h); if (e.name == null) e.name = ""; }

async function saveCodeList() {

  const vault = await encryptObj(session.key, list);

async function deleteCode(nr) {

  const [entry] = ui.adminVault.splice(i, 1);

  if (nr <= 20 && !codeList.deleted.includes(entry.h)) codeList.deleted.push(entry.h);
  try { await saveCodeList(); }
  catch (err) { ui.adminVault.splice(i, 0, entry); codeList.deleted = prevDeleted; throw err; }

}

function getDb() {
  if (!dbP) dbP = (async () => {
    const app = await fbApp();
    if (!app) return null;
    const fs = await import(FB_URL + "firebase-firestore.js");
    const db = fs.getFirestore(app);
    const wrap = sn => ({ exists: sn.exists(), data: () => sn.data(), metadata: sn.metadata });
    return {
      doc(path) {
        const ref = fs.doc(db, path);
        return {
          get: () => fs.getDoc(ref).then(wrap, e => { throw fbErr(e); }),
          set: data => fs.setDoc(ref, data).catch(e => { throw fbErr(e); }),
          update: data => fs.updateDoc(ref, data).catch(e => { throw fbErr(e); }),
          delete: () => fs.deleteDoc(ref).catch(e => { throw fbErr(e); }),
          onSnapshot: (next, err) => fs.onSnapshot(ref, { includeMetadataChanges: true }, sn => next(wrap(sn)), e => err && err(fbErr(e)))

let docRef = null, unsub = null, snapTimer = null, serverSeen = false, writing = false, again = false, noWrite = false, syncState = "local", remoteTimer = null;
let localChain = Promise.resolve(), dbP = null;
const SYNC_TEXT = { local: "Nur auf diesem Gerät", connecting: "Verbinde …", synced: "Auf allen Geräten gespeichert", saving: "Speichert …", offline: "Keine Verbindung – lokal gespeichert", error: "Sync-Fehler – lokal gespeichert", readonly: "Nur auf diesem Gerät gespeichert" };
function saveLocal() {
  const my = session; if (!my) return;
  const st = JSON.parse(JSON.stringify(realState()));
  localChain = localChain.then(async () => { try { writeLS(LS_PREFIX + my.docId, JSON.stringify(await encryptObj(my.key, st))); } catch (e) {} });
}
async function openProfile() {
  const my = session;

  try { const raw = readLS(LS_PREFIX + my.docId); if (raw) state = migrate(await decryptObj(my.key, JSON.parse(raw))); } catch (e) {}
  if (session !== my) return;
  setSync("local"); updateHeader(); render();
  await connectSync(my);
}
async function connectSync(my) {
  const d = await getDb();
  if (!d || session !== my || docRef) return;
  try { docRef = d.doc("nm/" + my.docId); } catch (e) { return; }
  serverSeen = false; noWrite = false; setSync("connecting");
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => { if (session === my && !serverSeen) setSync("offline"); }, 10000);
  unsub = docRef.onSnapshot(async snap => {
    if (session !== my || snap.metadata.hasPendingWrites) return;
    const mig = !snap.exists && !snap.metadata.fromCache ? MIGRATION_DOCS[my.docId] || null : null;
    const data = snap.exists ? snap.data() : mig;
    const remoteAt = data && typeof data.updatedAt === "number" ? data.updatedAt : 0;
    if (data && data.ct && remoteAt > (realState().updatedAt || 0)) {
      try {
        const s = await decryptObj(my.key, data);
        if (session !== my) return;
        if (forecast) { forecast.real = migrate(s); saveLocal(); toast("Deine echten Noten wurden auf einem anderen Gerät geändert"); }
        else {
          state = migrate(s);
          ui.edit = null; // auf einem anderen Gerät geändert: Bearbeitung hier beenden
          saveLocal(); render();
        }
      } catch (e) {}
    }
    if (!snap.metadata.fromCache) {
      clearTimeout(snapTimer);
      const first = !serverSeen; serverSeen = true;
      if (mig || (first && (realState().updatedAt || 0) > remoteAt)) flush(); else if (!writing && !noWrite) setSync("synced");
    }
  }, err => { clearTimeout(snapTimer); if (session === my) setSync("error"); });
}
function setSync(s) {
  syncState = s;
  const el = document.getElementById("sync"); el.dataset.s = s;
  document.getElementById("sync-text").textContent = SYNC_TEXT[s] || s;
  const d = document.getElementById("sync-detail"); if (d) d.textContent = syncDetail();
}
function syncDetail() {
  if (syncState === "readonly") return "Du hast keinen Schreibzugriff auf den geteilten Speicher dieser App. Dein Profil wird deshalb verschlüsselt nur in diesem Browser gespeichert. Mach regelmäßig ein Backup.";
  if (syncState === "local") return "Dein Profil wird verschlüsselt in diesem Browser gespeichert. Mach regelmäßig ein Backup.";
  return "Dein Profil liegt verschlüsselt in der Datenbank und ist auf jedem Gerät mit deinem Code verfügbar.";
}
function scheduleRemote() {
  if (!docRef || noWrite) return;
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(() => { remoteTimer = null; flush(); }, 700);
}
async function flush() {
  const ref = docRef, my = session, st = realState();
  if (!ref || !my || !serverSeen || noWrite) return;
  if (writing) { again = true; return; }
  writing = true; setSync("saving");
  try {
    const p = await encryptObj(my.key, st);
    await ref.set({ v: 1, updatedAt: st.updatedAt || 0, iv: p.iv, ct: p.ct });
    if (session === my) setSync("synced");
  } catch (err) {
    if (err && err.code === "invalid_argument") { noWrite = true; setSync("readonly"); }
    else { setSync("error"); if (err && err.code === "quota_exceeded") toast("Speicher voll – bitte Backup herunterladen."); }
  }
  writing = false;
  if (again) { again = false; flush(); }
}
